<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية المؤرخ أحمد خالد</title>
  <meta name="theme-color" content="#08172b">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08172b;
      color: #fff;
    }
    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #c9a45c;
    }
    header h2 { color: #e5c47c; margin: 0; }
    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      background: radial-gradient(circle, #193b60, #08172b 70%);
    }
    .symbol {
      font-size: 90px;
      color: #e5c47c;
      text-shadow: 0 10px 30px #c9a45c66;
    }
    h1 { font-size: 34px; line-height: 1.6; }
    h1 span { color: #e5c47c; }
    p { color: #c2ccda; line-height: 1.9; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .gold { background: #e5c47c; color: #102039; }
    .outline {
      background: transparent;
      border: 1px solid #e5c47c;
      color: #fff;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #aab8c9;
    }
  </style>
</head>
<body>
  <header>
    <h2>أكاديمية المؤرخ أحمد خالد</h2>
  </header>

  <main class="hero">
    <div class="symbol">𓂀</div>
    <h1>التاريخ ليس ماضياً...<br><span>بل حكاية تصنع وعيك</span></h1>
    <p>رحلتك لفهم التاريخ والتميز تبدأ من هنا.</p>
    <div>
      <button class="gold" onclick="alert('سيتم تفعيل إنشاء الحساب قريباً')">
        إنشاء حساب
      </button>
      <button class="outline" onclick="alert('سيتم تفعيل تسجيل الدخول قريباً')">
        تسجيل الدخول
      </button>
    </div>
  </main>

  <footer>© أكاديمية المؤرخ أحمد خالد</footer>
</body>
</html>
